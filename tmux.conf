# ============================================================
# Powerline Blue - Tmux Theme (atualizado para tmux >= 2.9)
# ============================================================

# CORREÇÃO CRÍTICA: use tmux-256color (não screen-256color)
# Isso resolve fundos vermelhos/incorretos em apps TUI modernos
# como Claude Code, Neovim, etc.
set -g default-terminal "tmux-256color"

# Habilita true color (24-bit) para terminais que suportam
# (gnome-terminal, kitty, alacritty, etc.)
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",tmux-256color:RGB"

# Reduz o delay do Esc (padrão 500ms — causa lag em editores)
set -sg escape-time 10

# Status update interval
set -g status-interval 1

# Basic status bar colors
set -g status-style fg=colour238,bg=colour233

# Left side of status bar
set -g status-left-style fg=colour243,bg=colour233
set -g status-left-length 40
set -g status-left "#[fg=colour232,bg=colour24,bold] #S #[fg=colour24,bg=colour240,nobold]#[fg=colour233,bg=colour240] #(whoami) #[fg=colour240,bg=colour235]#[fg=colour240,bg=colour235] #I:#P #[fg=colour235,bg=colour233,nobold]"

# Right side of status bar
set -g status-right-style fg=colour243,bg=colour233
set -g status-right-length 150
set -g status-right "#[fg=colour235,bg=colour233]#[fg=colour240,bg=colour235] %H:%M:%S #[fg=colour240,bg=colour235]#[fg=colour233,bg=colour240] %d-%b-%y #[fg=colour245,bg=colour240]#[fg=colour232,bg=colour245,bold] #H "

# Window status
set -g window-status-format " #I:#W#F "
set -g window-status-current-format "#[fg=colour233,bg=black]#[fg=colour33,nobold] #I:#W#F #[fg=colour233,bg=black,nobold]"

# Current window status (sintaxe nova: -style)
set -g window-status-current-style fg=colour235,bg=colour100

# Window with activity status
set -g window-status-activity-style fg=colour233,bg=colour245

# Window separator
set -g window-status-separator ""

# Window status alignment
set -g status-justify centre

# Pane border (sintaxe nova)
set -g pane-border-style fg=colour238,bg=default

# Active pane border
set -g pane-active-border-style fg=colour24,bg=default

# Pane number indicator
set -g display-panes-colour colour233
set -g display-panes-active-colour colour245

# Clock mode
set -g clock-mode-colour colour24
set -g clock-mode-style 24

# Message (sintaxe nova)
set -g message-style fg=black,bg=colour24

# Command message
set -g message-command-style fg=black,bg=colour233

# Mode
set -g mode-style fg=colour231,bg=colour24
